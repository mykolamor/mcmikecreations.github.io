<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hike image matcher</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Hike image matcher</h1>
  <div class="spacer"></div>
  <span id="conn" class="pill">checking…</span>
  <button id="settings-btn">Settings</button>
</header>

<main>
  <aside id="hikes-panel">
    <div class="panel-head">
      <strong>Hikes &amp; places</strong>
      <button id="new-place-btn" title="Create a place doc: reference text shown in every hike that lists it">New place…</button>
      <button id="refresh-btn" title="Re-scan the posts and places directories">Refresh</button>
    </div>
    <input id="hike-filter" type="search" placeholder="Filter hikes and places…">
    <ul id="hikes" class="list"></ul>
  </aside>

  <aside id="media-panel">
    <div class="panel-head">
      <strong id="post-name">No hike selected</strong>
    </div>
    <div id="post-meta" class="meta"></div>
    <ul id="media" class="list"></ul>
    <ul class="legend">
      <li><i style="background:#1a7f37"></i>matched</li>
      <li><i style="background:#9a6700"></i>ambiguous</li>
      <li><i style="background:#cf222e"></i>unmatched / missing</li>
      <li><i style="background:#8c959f"></i>video / youtube</li>
      <li><i style="background:#1f2328"></i>not in JSON</li>
    </ul>
  </aside>

  <section id="compare">
    <div class="toolbar">
      <button id="add-btn" disabled>Add media…</button>
      <button id="rerun-btn" disabled>Re-run match for this hike</button>
      <button id="edit-place-btn" hidden title="Edit this place doc's title, description, tags, aliases and text">Edit text…</button>
      <a id="open-site" class="btn-link" target="_blank" rel="noopener noreferrer"
         title="Open this hike on the deployed site">Open on site ↗</a>
      <button id="remove-btn" class="danger" disabled
              title="Remove this item from the JSON and the post, and delete its local files">Remove…</button>
      <span id="entry-status" class="pill"></span>
      <div class="spacer"></div>
      <span id="msg"></span>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label>Local</label>
          <input id="local-path" type="text" spellcheck="false" disabled>
          <button id="local-apply" disabled>Apply</button>
        </div>
        <div class="caption" id="local-caption"></div>
        <div class="frame" id="local-frame"><span class="hint">Select a media item</span></div>
      </div>
      <div class="pane">
        <div class="pane-head">
          <label>Immich</label>
          <input id="remote-path" type="text" spellcheck="false"
                 placeholder="filename, asset id, or link — empty clears the match" disabled>
          <button id="remote-apply" disabled>Apply</button>
          <button id="pick-btn" disabled title="Browse this hike's candidates">Pick…</button>
          <button id="remote-open" disabled title="Open this asset on Immich">Open</button>
        </div>
        <div class="caption" id="remote-caption"></div>
        <div class="frame" id="remote-frame"><span class="hint"></span></div>
      </div>
    </div>
  </section>
</main>

<dialog id="settings-dlg">
  <form method="dialog">
    <h2>Settings</h2>
    <label>Immich URL</label>
    <input id="set-url" type="text" spellcheck="false" autocomplete="off"
           placeholder="https://immich.example.com">
    <label>API key</label>
    <input id="set-key" type="password" placeholder="paste your Immich API key"
           autocomplete="off" spellcheck="false">
    <div class="row">
      <label class="inline"><input id="set-remember" type="checkbox"> Remember on this machine</label>
      <span id="set-hint" class="muted"></span>
    </div>
    <div class="paths muted" id="set-paths"></div>
    <menu>
      <button value="cancel">Cancel</button>
      <button id="set-test" type="button">Test connection</button>
      <button id="set-save" value="save" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="add-dlg">
  <form method="dialog">
    <h2>Add media</h2>
    <div class="modes">
      <label class="inline"><input type="radio" name="mode" value="local" checked>
        A local image — find its Immich original</label>
      <label class="inline"><input type="radio" name="mode" value="remote">
        An Immich asset — download and convert it to AVIF locally</label>
      <label class="inline"><input type="radio" name="mode" value="both">
        Both — just record the mapping</label>
    </div>
    <label>Local file (absolute path)</label>
    <input id="add-local" type="text" spellcheck="false">
    <label>Immich asset (filename, id, or link)</label>
    <div class="row">
      <input id="add-asset" type="text" spellcheck="false">
      <button id="add-pick" type="button">Pick…</button>
    </div>
    <label>Save as</label>
    <input id="add-out" type="text" spellcheck="false" placeholder="2025-08-13-12.jpg">
    <p class="muted" id="add-hint"></p>
    <menu>
      <button value="cancel">Cancel</button>
      <button id="add-go" value="add" class="primary">Add</button>
    </menu>
  </form>
</dialog>

<dialog id="place-dlg">
  <form method="dialog">
    <h2 id="place-dlg-title">Place doc</h2>
    <div id="place-slug-row">
      <label>Slug (file name, used in a post's <code>places:</code>)</label>
      <input id="place-slug" type="text" spellcheck="false" placeholder="knorrhuette">
    </div>
    <label>Title</label>
    <input id="place-title" type="text">
    <label>Description (one sentence)</label>
    <input id="place-description" type="text">
    <div class="row">
      <div class="grow">
        <label>Tags (comma-separated)</label>
        <input id="place-tags" type="text" placeholder="Hut, DAV">
      </div>
      <div class="grow">
        <label>Aliases: names in hike text that link here (comma-separated; title if empty)</label>
        <input id="place-aliases" type="text" placeholder="Knorrhütte, Knorr hut">
      </div>
    </div>
    <label>Text (markdown; images as <code>![caption](/images/projects/data-viz/hikes/places/&lt;slug&gt;/…)</code>)</label>
    <textarea id="place-body" rows="16" spellcheck="true"></textarea>
    <p class="muted" id="place-hint"></p>
    <menu>
      <button id="place-insert" type="button" title="Append the selected media item to the text">Insert selected image</button>
      <div class="spacer"></div>
      <button value="cancel">Cancel</button>
      <button id="place-save" value="save" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="pick-dlg">
  <form method="dialog">
    <h2>Select Immich asset</h2>
    <div id="pick-search" class="row" hidden>
      <input id="pick-query" type="search" placeholder="Search Immich: text (e.g. Knorrhütte)">
      <input id="pick-from" type="date" title="Taken on or after">
      <input id="pick-to" type="date" title="Taken on or before">
      <button id="pick-go" type="button">Search</button>
    </div>
    <input id="pick-filter" type="search" placeholder="Filter by filename…">
    <ul id="pick-list" class="list picker"></ul>
    <menu><button value="cancel">Close</button></menu>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
